
name: Daily Portal Job Scraper & Emailer

on:
  schedule:
    - cron: '0 8 * * *' # 06:00 UTC = 08:00 CEST
  workflow_dispatch:

jobs:
  run-daily-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.4.0

      - name: Install Dependencies
        run: |
          pip install openpyxl requests

      - name: Run Scraper & Send Mail
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python portal_scraper_agent.py
